[tool.poetry]
name = "todo-api"
version = "1.0.0"
description = "Async FastAPI todo service with layered architecture"
authors = ["Anastasiia Matveeva <armatveeeva@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.109.0,<1.0.0"
uvicorn = { version = ">=0.27.0,<1.0.0", extras = ["standard"] }
sqlalchemy = { version = "2.0.25", extras = ["asyncio"] }
asyncpg = ">=0.29.0,<1.0.0"
alembic = "1.13.1"
pydantic = "^2.5"
pydantic-settings = "^2.1"
python-dotenv = "1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "^0.23"
httpx = "0.26.0"
aiosqlite = "^0.19"
ruff = "^0.11"
pre-commit = "^4.0"
mypy = "^2.4.1"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
